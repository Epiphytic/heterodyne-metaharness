# Example host config. `heterodyne setup` copies this to $HETERODYNE_CONFIG_DIR/config.toml.
# Replace every <placeholder>. Policy (approvers, identities, tiers) goes in policy.toml, not here.

[platform]
os = "<linux-or-macos>"          # written by `heterodyne setup`
service_manager = "<service-manager>"   # systemd or launchd; written by `heterodyne setup` (§3.2)
sandbox = "<sandbox-backend>"   # openshell (Linux), or none; written by `heterodyne setup` (§3.2, §7)

# Profiles: adapter + model + launch options (§4.1). One profile is enough; two different
# models are recommended so reviews are cross-model rather than adversarial (§11.1).
[profiles.coder]
adapter = "codex"
model = "<model-name>"

[profiles.reviewer]
adapter = "claude-code"
model = "<model-name>"

# Accounts (§4.4): a named login for one adapter. Host config only. Refused on every adapter until spike
# S7 demonstrates login binding for it (§4.4 D9), so leave this commented for now.
# [accounts.<account-name>]
# adapter   = "codex"
# login_dir = "<directory holding this login>"   # absolute or ~/...; never a secret reference
#
# Then, in a profile:
#   accounts = ["<account-name>"]   # order is preference; omit for the adapter's default login
#   failover = "none"               # or "next" (needs a trusted usage read, §4.4 D6)

[roles]
coder = "coder"
reviewer = "reviewer"

[sandbox]
egress_approved = ["pypi.org", "files.pythonhosted.org", "registry.npmjs.org"]
# Directory trees a workstream may add as read-only mounts (absolute paths; a subpath of an
# entry is allowed, a sibling like <entry>-other is not). Empty means none.
ro_mounts_approved = []
# The OpenShell runtime (§7; packaging/sandbox/README.md). Defaults apply to whatever is left out.
# image = "<workload-image>"            # built from packaging/sandbox/Containerfile
# max_lifetime_minutes = <minutes>      # a session is stopped and resumed at this age (D13)
# stop_margin_minutes = <minutes>       # the stop window, and the margin kept before a login expires
# tool_env = { PATH = "<podman-5-bin>:<the rest of PATH>" }   # the environment openshell and podman run with

[integrations.beads]
btq = "<path-to-btq-checkout>"           # wsd loads <checkout>/bin/btq
# credentials = { file = "<path-to-btq-credentials.json>" }   # optional; inline secrets are refused

[integrations.marmot]
socket = "<path-to-wn-agent-socket>"
auth_token = { command = "<command-that-prints-the-token>" }

# Admin override channel (ADR §8; see docs/admind.md). Host config only.
[admind]
profile = "reviewer"                  # the admin agent's profile; its adapter must be claude-code
restart_units = ["<unit-name>.service"]   # the only units `!restart` accepts
# Use a dedicated directory: Claude Code does not remember workspace trust for the home directory
# (the default), so every relaunch would block on the trust dialog and end in AgentStuck.
workdir = "<dedicated-admin-workdir>"
# Optional: lets operators decide btq approval asks from Marmot (docs/admind.md, section 10). Absolute
# path, no ~. Remove it before rolling back to an admind older than the relay: that one exits 78 on it.
# approve_bead = "/path/to/beads-task-queue/bin/approve-bead"

[admind.marmot]
relays = ["<wss-relay-url>"]
