# Built-in defaults (ADR 0001 §15 layer 1). Adapters are defined; no models are chosen.

[adapters]
known = ["claude-code", "codex"]

[review]
mode_when_same_model = "adversarial"   # or "block"

[timeouts]
gatekeeper_seconds = 60
hook_wait_seconds = 5
reminder_hours = 4
delivery_alert_minutes = 10

# Action classes by tier (§5.3). Host policy may re-tier classes, except `locked` ones,
# which can never be lowered. Workstreams may only tighten, via [restrict].
[tiers]
auto_approve = ["worktree_edit", "run_tests", "local_git", "dependency_install"]
escalate = ["push_branch", "open_pr", "merge_pr", "deploy", "notify", "new_egress_host"]
hard_deny = ["modify_harness_config", "modify_policy", "modify_sandbox"]
locked = ["modify_harness_config", "modify_policy", "modify_sandbox"]

# Executable of each adapter's CLI. Hosts override with an absolute path if it is not on PATH.
[adapters.claude-code]
binary = "claude"

[adapters.codex]
binary = "codex"

# Admin override channel (§8). `profile` has no default: the host must name one.
[admind]
workdir = "~"
restart_units = []
chunk_chars = 4000
alert_poll_seconds = 5
group_check_seconds = 60
start_timeout_seconds = 60
turn_notice_seconds = 1800
group_name = "heterodyne admin"
reply_verbatim_lines = 8
reply_verbatim_chars = 800
ask_bump_hours = 12

[admind.marmot]
wn_agent = "wn-agent"
relays = []

# The workstream daemon (§4.3, §9). Host only; [integrations.beads] says where btq and the queue are.
[wsd]
backstop_seconds = 60
reconcile_seconds = 300
launch_failures_before_human = 2
park_attempts_before_human = 3
inbox_attempts_before_human = 3
coder_role = "coder"

# Usage-aware scheduling (§4.4 D3-D5). Host only; accounts have no defaults.
[usage]
reserve_percent             = 5     # a trusted window blocks at >= 100 - reserve_percent used
stale_minutes               = 30
unknown_backoff_minutes     = 30
untrusted_max_defer_minutes = 60    # the longest a session's own untrusted report can defer it
min_recheck_seconds         = 60
max_window_hours            = 192   # the longest reset horizon accepted

# The agent sandbox (§7). Host only, apart from each workstream's extra_egress and extra_ro_mounts. The
# backend is `[platform] sandbox` (written by `heterodyne setup`); without it wsd runs no agents.
[sandbox]
egress_approved = []
ro_mounts_approved = []
image = "localhost/heterodyne-agent:1"
openshell = "openshell"
podman = "podman"
max_lifetime_minutes = 120
stop_margin_minutes = 15
probe_allowed_host = "api.openai.com"   # the self-test's allowlisted control (§7 Egress)
probe_denied_host = "example.org"       # the self-test's refused host
agent_probe_seconds = 240

# Variables for the openshell and podman commands only (for example the PATH of a side-by-side podman).
# Never passed into a sandbox.
[sandbox.tool_env]
