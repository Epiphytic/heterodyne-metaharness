[project]
name = "heterodyne-metaharness"
version = "0.1.0"
description = "Deterministic control plane for sandboxed, externally run coding agents, steered over Marmot"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.19",
]

[project.scripts]
heterodyne = "heterodyne.cli:main"
admind = "heterodyne.admind.cli:main"
wsd = "heterodyne.wsd.cli:wsd_main"
wsctl = "heterodyne.wsd.cli:wsctl_main"
ws-hook = "heterodyne.session.shim:hook_main"
ws-request = "heterodyne.session.shim:request_main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heterodyne"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PTH"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"spikes/**" = ["S", "PTH", "B", "E501"]
"src/heterodyne/sandbox/resources/**" = ["S", "PTH"]

[tool.pyright]
include = ["src", "tests", "scripts"]
strict = ["src"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
extraPaths = ["src", "tests"]
