name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# A newer push to the same branch or PR cancels the older run, so self-hosted runners are not tied up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Self-hosted runners only, on the operator's local network (operator decision 2026-10-09).
    # Never GitHub-hosted macOS or paid runners. The repository is public, so a pull request from a
    # fork never runs on these hosts: only pushes to main and same-repository pull requests do.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        # Platform seam matrix (ADR 0001 §11).
        include:
          - name: linux-x64
            runner: [self-hosted, Linux, X64, bel-ci]
          - name: linux-arm64
            runner: [self-hosted, Linux, ARM64, laptop-ci]
          - name: macos-arm64
            runner: [self-hosted, macOS, ARM64, laptop-ci]
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      # tmux-backed tests must run, not skip: HZ_REQUIRE_TMUX fails the session if tmux is missing.
      # The runner hosts provide tmux; CI never installs packages on them.
      - name: tmux present
        run: tmux -V
      # The admind tests put a Unix socket under tmp_path, and a socket path is limited to about 100
      # bytes. pytest's default base, $TMPDIR/pytest-of-<user>, grows with the runner's user name,
      # so each job gets its own short, unique base instead.
      - name: short pytest base
        run: echo "PYTEST_ADDOPTS=--basetemp=$(mktemp -d /tmp/hzXXXX)" >> "$GITHUB_ENV"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pyright
      - run: uv run pytest -q
        env:
          HZ_REQUIRE_TMUX: "1"
      # Install-agnostic check (ADR 0001 §15). No host-local leakcheck.txt exists on CI runners.
      - run: uv run python scripts/check_install_agnostic.py
  secrets:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, bel-ci]
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  # linux_x64 tarball
      V2_BASE: 13588b4eeb365ef076af6465654abac7a82706e9  # parent of e1cd4ae, the first v2 commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-pinned release)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      # Scope: v2 commits only (V2_BASE..HEAD). Pre-v2 history contains a public operator key that
      # gitleaks flags; operator decision 2026-09-30 is to leave that history alone and not scan it.
      # V2_BASE is the parent of the first v2 commit; fetch-depth: 0 makes it resolvable, and the
      # job fails (rather than silently scanning nothing) if it is missing, not an ancestor of HEAD,
      # or the range is empty.
      - name: gitleaks (v2 history)
        run: |
          git cat-file -e "${V2_BASE}^{commit}"
          git merge-base --is-ancestor "$V2_BASE" HEAD
          count=$(git rev-list --count "${V2_BASE}..HEAD")
          if [ "$count" -lt 1 ]; then echo "gitleaks range ${V2_BASE}..HEAD is empty" >&2; exit 1; fi
          echo "scanning $count v2 commits"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact -v --log-opts="${V2_BASE}..HEAD" .
