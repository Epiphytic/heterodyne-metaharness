name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]   # platform seam matrix (ADR 0001 §11)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run pyright
      - run: uv run pytest -q
      # Install-agnostic check (ADR 0001 §15). No host-local leakcheck.txt exists on CI runners.
      - run: uv run python scripts/check_install_agnostic.py
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  # linux_x64 tarball
      V2_BASE: 13588b4eeb365ef076af6465654abac7a82706e9  # parent of e1cd4ae, the first v2 commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-pinned release)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      # Scope: v2 commits only (V2_BASE..HEAD). Pre-v2 history contains a public operator key that
      # gitleaks flags; operator decision 2026-09-30 is to leave that history alone and not scan it.
      # V2_BASE is the parent of the first v2 commit; fetch-depth: 0 makes it resolvable, and the
      # job fails (rather than silently scanning nothing) if it is missing, not an ancestor of HEAD,
      # or the range is empty.
      - name: gitleaks (v2 history)
        run: |
          git cat-file -e "${V2_BASE}^{commit}"
          git merge-base --is-ancestor "$V2_BASE" HEAD
          count=$(git rev-list --count "${V2_BASE}..HEAD")
          if [ "$count" -lt 1 ]; then echo "gitleaks range ${V2_BASE}..HEAD is empty" >&2; exit 1; fi
          echo "scanning $count v2 commits"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact -v --log-opts="${V2_BASE}..HEAD" .
